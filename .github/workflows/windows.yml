name: Build, test, and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Build and verify installed product
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          $version = '1.0.0'
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            if ($env:BUILD_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Release tags must have the form v1.2.3.' }
            $version = $Matches[1]
          }
          ./scripts/Build.ps1 -Version $version -TestInstaller
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-evidence
          path: |
            artifacts/test-results
            artifacts/installer-smoke
            artifacts/upgrade-smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Keep verified installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-installer
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-installer
          path: artifacts/release
      - name: Publish verified MSI and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must already be on main.' }
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          $notes = 'RELEASE_NOTES.md'
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', "File List to Excel $env:RELEASE_TAG") + $assets
          if (Test-Path -LiteralPath $notes) { $arguments += @('--notes-file', $notes) }
          else { $arguments += '--generate-notes' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
